# Proxy block for the citeline API, included inside the butterflyfx.us
# server { } for port 443.
#
#   include /etc/nginx/snippets/citeline-api.conf;
#
# The trailing slashes matter: /api/citeline/retrieve maps to /retrieve on the
# upstream, so the service keeps clean paths and knows nothing about where it is
# mounted.

location /api/citeline/ {
    proxy_pass http://127.0.0.1:8811/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generation runs on a CPU only host and a cold model load is slow, so the
    # read timeout is generous. Retrieval answers in well under a second; it is
    # only the /query path that needs this much room.
    proxy_connect_timeout 5s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # The demo is public, so cap the damage a script can do. This is a second
    # limit on top of the application's own per minute limit.
    limit_req zone=citeline burst=5 nodelay;
    limit_req_status 429;

    # Answers depend on live state; never let a proxy cache them.
    add_header Cache-Control "no-store" always;
}

# The Prometheus endpoint and the corpus statistics are useful to me and of no
# use to the public, so metrics stays private while stats is open.
location = /api/citeline/metrics {
    deny all;
    return 403;
}
